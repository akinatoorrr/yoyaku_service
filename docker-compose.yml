version: '3.9'
services:
  db:
    image: postgres:15
    restart: on-failure
    env_file:
      - .env.docker
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 5s
      retries: 5

  backend:
    build: .
    restart: on-failure
    environment:
      IN_DOCKER: "1"
      ENV_FILE: /app/.env.local
      GUNICORN_WORKERS: 4
    volumes:
      - .:/app:delegated
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    command: >
     sh -c "poetry run python manage.py migrate &&
         poetry run gunicorn yoyaku.wsgi:application --bind 0.0.0.0:8000 --workers=4 --access-logfile - --error-logfile -"

volumes:
  pg_data:
