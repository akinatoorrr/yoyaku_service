[tool.poetry]
name = "yoyaku-service"
version = "0.1.0"
description = ""
authors = ["Andrey Akinin <akininandrej007@gmail.com>"]

# Отключаем установку проекта как пакета
package-mode = false

# Описание зависимостей приложения
[tool.poetry.dependencies]
python = ">=3.12"
django = ">=5.2.3,<6.0.0"
djangorestframework = ">=3.16.0,<4.0.0"
psycopg2-binary = ">=2.9.10,<3.0.0"
pydantic-settings = ">=2.9.1,<3.0.0"
requests = ">=2.32.4,<3.0.0"
gunicorn = "^23.0.0"

[tool.poetry.group.dev.dependencies]
pytest = { version = ">=8.4.0,<9.0.0", optional = false }
pytest-django = { version = ">=4.11.1,<5.0.0", optional = false }
pre-commit = { version = ">=4.2.0,<5.0.0", optional = false }
ruff = { version = ">=0.12.0,<0.13.0", optional = false }

[tool.poetry.plugins."poetry.application.plugin"]
dotenv = "poetry_dotenv.plugin:DotenvPlugin"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

# Остальные твои секции (tool.ruff, tool.pytest.ini_options) остаются без изменений


[tool.ruff]
# Указываем версию Python проекта
target-version = "py312"

# Максимальная длина строки (совместим с black)
line-length = 88

# Какие правила включать (по группам)
select = [
  "E",  # pycodestyle (PEP8)
  "F",  # pyflakes (ошибки, неиспользуемые переменные)
  "I",  # isort (сортировка импортов)
  "B",  # flake8-bugbear (ошибки дизайна)
  "S",  # bandit (безопасность)
  "T20",  # flake8-print (печать в проде)
  "UP",  # pyupgrade (советы по синтаксису)
]

# Какие правила игнорировать
ignore = [
  "B008",  # не проверять передачу mutable default аргументов
  "S101",
  "S310",
]

# Файлы и папки, которые исключаем из анализа
exclude = [
  ".venv",
  "__pycache__",
  "migrations",
  ".git",
  "settings.py"
]

# Автоформатирование
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "yoyaku.settings"
norecursedirs = 'env/* venv/* ruff_cache/*'
testpaths = 'tests/'
python_files = 'test_*.py'
addopts = "-ra --strict-markers -v"
